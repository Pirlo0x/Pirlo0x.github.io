<!DOCTYPE html>
<html>
<head>
  <title>Test Page</title>
  <script>
    fetch("https://google.com/")
      .then(res => {
        const timestamp = Date.now();
        if (res.status === 404) {
          // Treat 404 as failure
          new Image().src = "https://3678iya9s5flykg5btyggo7h288zwrnfc.oastify.com/fail?ts=" + timestamp;
        } else {
          // Treat all other status codes as success
          new Image().src = "https://3678iya9s5flykg5btyggo7h288zwrnfc.oastify.com/hit?ts=" + timestamp;
        }
      })
      .catch(() => {
        // Network error or fetch exception
        const timestamp = Date.now();
        new Image().src = "https://3678iya9s5flykg5btyggo7h288zwrnfc.oastify.com/fail?ts=" + timestamp;
      });
  </script>
</head>
<body>
  <h1>It works! Your site is live 🚀</h1>
</body>
</html>
